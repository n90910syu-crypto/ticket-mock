<!DOCTYPE html>
<html lang="ja"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>整理番号入力</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Hiragino Sans", "Hiragino Kaku Gothic ProN",
                   Arial, sans-serif;
      background: #f7f7f7;
      padding: 24px;
    }

    .box {
      max-width: 420px;
      margin: 0 auto;
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
    }

    h2 {
      font-size: 20px;
      margin-bottom: 16px;
      text-align: center;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      font-size: 20px;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    .btn {
      display: block;
      width: 100%;
      height: 48px;
      border-radius: 999px;
      border: none;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      line-height: 48px;
      text-decoration: none;
      box-sizing: border-box;
    }

    .save {
      margin-top: 20px;
      background: #2d9cdb;
      color: #fff;
    }

    .link-area {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }

    .link {
      flex: 1;
      background: #eee;
      color: #333;
    }

    .link.disabled {
      opacity: 0.45;
      pointer-events: none;
      cursor: not-allowed;
    }

    .note {
      margin-top: 14px;
      font-size: 13px;
      color: #666;
      line-height: 1.6;
      text-align: center;
    }

    select {
      width: 100%;
      font-size: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      background: #fff;
    }

    .divider {
      margin: 24px 0;
      border: none;
      border-top: 1px solid #e2e2e2;
    }

    .fetch-btn {
      margin-top: 12px;
      background: #6c5ce7;
      color: #fff;
    }

    .result-box {
      margin-top: 16px;
      padding: 14px;
      background: #f7f7f7;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.7;
      color: #333;
      word-break: break-all;
      display: none;
    }

    .result-box.show {
      display: block;
    }

    .result-box img {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 8px;
    }

    .status-text {
      margin-top: 10px;
      font-size: 13px;
      color: #888;
      text-align: center;
    }

    .picker-row {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .picker-row select {
      flex: 1;
      min-width: 60px;
      font-size: 15px;
      padding: 10px 6px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    .picker-row span {
      font-size: 14px;
      color: #666;
      flex: none;
    }

    .picker-label {
      margin-top: 12px;
      font-size: 13px;
      font-weight: 700;
      color: #555;
    }

    .picker-btn {
      margin-top: 8px;
      background: #eee;
      color: #333;
      height: 40px;
      line-height: 40px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="box">

    <label for="userInput">整理番号</label>

    <input id="userInput" type="text" placeholder="S">

    <label for="userNameInput" style="margin-top:16px;">氏名</label>

    <input id="userNameInput" type="text" placeholder="中村 海斗">

    <label for="userGroupInput" style="margin-top:16px;">お目当てのグループ</label>

    <input id="userGroupInput" type="text" placeholder="Peel the Apple">

    <label for="userPhoneInput" style="margin-top:16px;">電話番号</label>

    <input id="userPhoneInput" type="text" placeholder="090-3728-9947">

    <label for="userAddressInput" style="margin-top:16px;">住所</label>

    <input id="userAddressInput" type="text" placeholder="〒102-8353 東京都千代田区六番町4番地5 SME六番町ビル">

    <hr class="divider">

    <label for="eventUrlInput">TIGETイベントURL</label>

    <input id="eventUrlInput" type="text" placeholder="https://tiget.net/events/524277">

    <a href="javascript:void(0);" target="_blank" rel="noopener" class="btn link disabled" id="openEventUrlLink" style="margin-top:8px; display:block;">
      このURLを開く
    </a>

    <button type="button" class="btn fetch-btn" id="fetchBtn">
      イベント情報を取得
    </button>

    <p class="status-text" id="fetchStatus"></p>

    <label for="eventTitleInput" style="margin-top:16px;">イベントタイトル</label>
    <input id="eventTitleInput" type="text" placeholder="自動取得 or 手入力">

    <label for="eventTicketTypeInput" style="margin-top:16px;">チケット種別</label>
    <select id="ticketTypeSelect" style="display:none; margin-bottom:8px;">
      <option value="">-- 候補から選ぶ --</option>
    </select>
    <input id="eventTicketTypeInput" type="text" placeholder="自動取得 or 手入力">

    <label for="eventDateInput" style="margin-top:16px;">日時</label>
    <input id="eventDateInput" type="text" placeholder="自動取得 or 手入力">

    <div class="picker-row">
      <select id="dateYearSelect"></select><span>年</span>
      <select id="dateMonthSelect"></select><span>月</span>
      <select id="dateDaySelect"></select><span>日</span>
    </div>
    <button type="button" class="btn picker-btn" id="dateApplyBtn">
      この日付を反映
    </button>

    <label for="eventShowtimeInput" style="margin-top:16px;">開場/開演</label>
    <input id="eventShowtimeInput" type="text" placeholder="自動取得 or 手入力">

    <div class="picker-label">開場</div>
    <div class="picker-row">
      <select id="openHourSelect"></select><span>:</span>
      <select id="openMinuteSelect"></select>
    </div>

    <div class="picker-label">開演</div>
    <div class="picker-row">
      <select id="startHourSelect"></select><span>:</span>
      <select id="startMinuteSelect"></select>
    </div>
    <button type="button" class="btn picker-btn" id="showtimeApplyBtn">
      この時刻を反映
    </button>

    <label for="eventImageInput" style="margin-top:16px;">画像URL</label>
    <input id="eventImageInput" type="text" placeholder="自動取得 or 手入力">

    <label for="eventVenueInput" style="margin-top:16px;">会場名</label>
    <input id="eventVenueInput" type="text" placeholder="自動取得 or 手入力">

    <label for="eventVenueMapInput" style="margin-top:16px;">地図URL(任意)</label>
    <input id="eventVenueMapInput" type="text" placeholder="自動取得 or 手入力(なくても可)">

    <label for="ticketColorSelect" style="margin-top:16px;">チケット画面の色(入場受付ボタンと上の時計の丸)</label>
    <select id="ticketColorSelect" style="margin-bottom:8px;">
      <option value="">標準(青)</option>
      <option value="#1cb804">緑</option>
      <option value="#e5265c">赤</option>
      <option value="#ff8c00">オレンジ</option>
      <option value="#f2c200">黄</option>
      <option value="#17b8d4">水色</option>
      <option value="#8a4fd8">紫</option>
      <option value="#ff5fa2">ピンク</option>
      <option value="#333333">黒</option>
      <option value="custom">自由に選ぶ…</option>
    </select>
    <input id="ticketColorPicker" type="color" value="#1cb804" style="height:40px; padding:2px; display:none;">

    <label style="margin-top:16px; display:flex; align-items:center; gap:8px; font-weight:normal;">
      <input id="showtimeNoDotCheck" type="checkbox" style="width:auto;">
      開場・開演の前の「・」を付けない(通し券形式のイベント)
    </label>

    <div class="result-box show" id="resultBox">
      <img id="resultImage" src="" alt="" style="display:none;">
    </div>

    <hr class="divider">

    <button type="button" class="btn save" id="saveAllBtn">
      保存
    </button>

    <button type="button" class="btn" id="resetAdmitBtn" style="margin-top:10px;background:#fff;border:1px solid #e63264;color:#e63264;">
      入場済みをリセット(もう一度もぎれる状態に戻す)
    </button>

    <div class="link-area">
      <a href="homepage.html" class="btn link disabled" id="goLink">
        GO
      </a>
    </div>







    <p class="note">
      ※必ず保存後に表示
    </p>
  </div>

  <script>
    const input = document.getElementById('userInput');
    const nameInput = document.getElementById('userNameInput');
    const groupInput = document.getElementById('userGroupInput');
    const phoneInput = document.getElementById('userPhoneInput');
    const addressInput = document.getElementById('userAddressInput');
    const goLink = document.getElementById('goLink');

    // 保存済みがあれば復元、なければ初期値(プレースホルダーと同じ)を表示
    function restore(el, key, fallback) {
      if (!el) return;
      const saved = localStorage.getItem(key);
      el.value = saved && saved.trim() !== '' ? saved : fallback;
    }

    restore(input, 'userInput', 'S');
    restore(nameInput, 'userName', '中村 海斗');
    restore(groupInput, 'userGroup', 'Peel the Apple');
    restore(phoneInput, 'userPhone', '090-3728-9947');
    restore(addressInput, 'userAddress', '〒102-8353 東京都千代田区六番町4番地5 SME六番町ビル');

    // イベント情報欄は毎回リセット(ページを開き直したら空の状態から始める)

    // GOは常に「保存」を押すまで無効。ページを開き直した時点で毎回無効に戻す。

    // ==========================
    // TIGETイベント情報の自動取得
    // ==========================
    const eventUrlInput = document.getElementById('eventUrlInput');
    const openEventUrlLink = document.getElementById('openEventUrlLink');
    const fetchBtn = document.getElementById('fetchBtn');
    const fetchStatus = document.getElementById('fetchStatus');
    const eventTitleInput = document.getElementById('eventTitleInput');
    const eventTicketTypeInput = document.getElementById('eventTicketTypeInput');
    const ticketTypeSelect = document.getElementById('ticketTypeSelect');
    const eventDateInput = document.getElementById('eventDateInput');
    const eventShowtimeInput = document.getElementById('eventShowtimeInput');
    const eventImageInput = document.getElementById('eventImageInput');
    const eventVenueInput = document.getElementById('eventVenueInput');
    const eventVenueMapInput = document.getElementById('eventVenueMapInput');
    const resultImage = document.getElementById('resultImage');
    const saveAllBtn = document.getElementById('saveAllBtn');

    const dateYearSelect = document.getElementById('dateYearSelect');
    const dateMonthSelect = document.getElementById('dateMonthSelect');
    const dateDaySelect = document.getElementById('dateDaySelect');
    const dateApplyBtn = document.getElementById('dateApplyBtn');

    const openHourSelect = document.getElementById('openHourSelect');
    const openMinuteSelect = document.getElementById('openMinuteSelect');
    const startHourSelect = document.getElementById('startHourSelect');
    const startMinuteSelect = document.getElementById('startMinuteSelect');
    const showtimeApplyBtn = document.getElementById('showtimeApplyBtn');

    // プルダウンに選択肢を詰める共通処理
    function fillSelectRange(select, start, end, pad) {
      for (let i = start; i <= end; i++) {
        const opt = document.createElement('option');
        const val = pad ? String(i).padStart(pad, '0') : String(i);
        opt.value = val;
        opt.textContent = val;
        select.appendChild(opt);
      }
    }

    const nowForPicker = new Date();
    fillSelectRange(dateYearSelect, nowForPicker.getFullYear() - 1, nowForPicker.getFullYear() + 3, 0);
    fillSelectRange(dateMonthSelect, 1, 12, 2);
    fillSelectRange(dateDaySelect, 1, 31, 2);
    fillSelectRange(openHourSelect, 0, 23, 2);
    fillSelectRange(openMinuteSelect, 0, 59, 2);
    fillSelectRange(startHourSelect, 0, 23, 2);
    fillSelectRange(startMinuteSelect, 0, 59, 2);

    // プルダウンの初期選択を「今日・現在時刻」にしておく(2025/01/01のような不自然な初期値を避ける)
    dateYearSelect.value = String(nowForPicker.getFullYear());
    dateMonthSelect.value = String(nowForPicker.getMonth() + 1).padStart(2, '0');
    dateDaySelect.value = String(nowForPicker.getDate()).padStart(2, '0');
    openHourSelect.value = String(nowForPicker.getHours()).padStart(2, '0');
    openMinuteSelect.value = String(nowForPicker.getMinutes()).padStart(2, '0');
    startHourSelect.value = String(nowForPicker.getHours()).padStart(2, '0');
    startMinuteSelect.value = String(nowForPicker.getMinutes()).padStart(2, '0');

    const weekdayKanji = ['日', '月', '火', '水', '木', '金', '土'];

    // 選んだ日付をテキスト欄に反映(取得済みでも上書き可能)
    dateApplyBtn.addEventListener('click', function () {
      const y = Number(dateYearSelect.value);
      const m = Number(dateMonthSelect.value);
      const d = Number(dateDaySelect.value);
      const weekday = weekdayKanji[new Date(y, m - 1, d).getDay()];
      eventDateInput.value =
        dateYearSelect.value + '年' +
        dateMonthSelect.value + '月' +
        dateDaySelect.value + '日(' + weekday + ')';
      goLink.classList.add('disabled');
    });

    // 選んだ開場/開演時刻をテキスト欄に反映(取得済みでも上書き可能)
    showtimeApplyBtn.addEventListener('click', function () {
      eventShowtimeInput.value =
        '開場 ' + openHourSelect.value + ':' + openMinuteSelect.value +
        '／開演 ' + startHourSelect.value + ':' + startMinuteSelect.value;
      goLink.classList.add('disabled');
    });

    // <br>より前のテキストだけを取り出す(ネストしたdivや価格部分を除外)
    function extractLeadingText(el) {
      let text = '';
      for (const node of el.childNodes) {
        if (node.nodeName && node.nodeName.toLowerCase() === 'br') break;
        text += node.textContent || '';
      }
      return text.trim();
    }

    function updateImagePreview() {
      const url = eventImageInput.value.trim();
      if (url) {
        resultImage.src = url;
        resultImage.style.display = 'block';
      } else {
        resultImage.style.display = 'none';
      }
    }

    eventImageInput.addEventListener('input', updateImagePreview);
    updateImagePreview();

    // ---- TIGET本体と同じ「どこから何を取るか」 ----
    // TIGETのチケット画面(showTicket → renderTicketContent)は、次の値を使って表示している。
    //   title=イベント名 / play_date=開催日 / open_time・start_time=開場・開演 / place+safe_map_url=会場名とそのリンク
    //   image=イベント画像 / ticket_name=チケット名。
    // イベントページ(公開ページ)では、これらはそれぞれ次の場所にある。
    //   イベント名 : h1.pg-event__header__title        (予備: og:title)
    //   開催日     : .pg-event__ordering__program__datetime  (予備: 開催日の項目 / ld+jsonのstartDate)
    //   会場名と地図: address.pg-event__header__address の a  (文字=会場名、href=地図などのリンク)
    //   開場・開演 : #event-ticket 内の dt「開場 15:30 / 開演 16:00」。同じ dl の h6 が、そのチケット名
    //   チケット名 : .c-ordering-btn__content__name の <br> より前
    //   画像       : .pg-event__event_image__figure img の data-src  (予備: og:image)
    let ticketShowtimeMap = {};   // チケット名 → 「開場 xx:xx／開演 xx:xx」

    function ownText(el) {
      let t = '';
      el.childNodes.forEach(function (n) { if (n.nodeType === 3) t += n.textContent; });
      return t.replace(/\s+/g, ' ').trim();
    }

    function normalizeShowtime(raw) {
      const m = String(raw || '').match(/開場\s*(\d{1,2}):(\d{2}).*?開演\s*(\d{1,2}):(\d{2})/);
      if (!m) return '';
      return '開場 ' + m[1].padStart(2, '0') + ':' + m[2] + '／開演 ' + m[3].padStart(2, '0') + ':' + m[4];
    }

    // 開場・開演を欄とプルダウンに反映する
    function applyShowtime(text) {
      if (!text) return;
      eventShowtimeInput.value = text;
      const m = text.match(/開場 (\d{2}):(\d{2})／開演 (\d{2}):(\d{2})/);
      if (m) {
        openHourSelect.value = m[1];
        openMinuteSelect.value = m[2];
        startHourSelect.value = m[3];
        startMinuteSelect.value = m[4];
      }
    }

    // #event-ticket の各 dl から、チケット名ごとの開場・開演を集める(TIGETはチケットごとに時刻を持つ)
    function collectTicketShowtimes(doc) {
      const map = {};
      doc.querySelectorAll('#event-ticket dl.pg-event__detail__section').forEach(function (dl) {
        const dt = dl.querySelector('.pg-event__detail__title');
        const h6 = dl.querySelector('.pg-event__detail__ticket__title');
        const time = dt ? normalizeShowtime(dt.textContent) : '';
        if (!time || !h6) return;
        // 「●予約(【前方】観覧チケット ※再入場時１D)」→「【前方】観覧チケット ※再入場時１D」
        const name = h6.textContent.trim().replace(/^[●○◆■]?\s*[^(（]*[(（]/, '').replace(/[)）]\s*$/, '').trim();
        if (name) map[name] = time;
        map['\u0000h6:' + h6.textContent.trim()] = time;
      });
      return map;
    }

    function showtimeForTicket(name) {
      if (!name) return '';
      if (ticketShowtimeMap[name]) return ticketShowtimeMap[name];
      // 表記ゆれ(空白や括弧の違い)に備えて、含み合いでも探す
      const keys = Object.keys(ticketShowtimeMap).filter(function (k) { return k.charAt(0) !== '\u0000'; });
      const hit = keys.find(function (k) { return k.indexOf(name) !== -1 || name.indexOf(k) !== -1; });
      return hit ? ticketShowtimeMap[hit] : '';
    }

    ticketTypeSelect.addEventListener('change', function () {
      if (ticketTypeSelect.value) {
        eventTicketTypeInput.value = ticketTypeSelect.value;
        // チケットを変えたら、そのチケットの開場・開演に切り替える(TIGETもチケットごとの時刻を表示する)
        applyShowtime(showtimeForTicket(ticketTypeSelect.value));
        goLink.classList.add('disabled');
      }
    });

    // 入力されたURLへの「このURLを開く」リンクを更新
    function updateOpenEventUrlLink() {
      const url = eventUrlInput.value.trim();
      if (url) {
        openEventUrlLink.href = url;
        openEventUrlLink.classList.remove('disabled');
      } else {
        openEventUrlLink.href = 'javascript:void(0);';
        openEventUrlLink.classList.add('disabled');
      }
    }
    eventUrlInput.addEventListener('input', updateOpenEventUrlLink);
    updateOpenEventUrlLink();

    fetchBtn.addEventListener('click', async function () {
      const url = eventUrlInput.value.trim();
      if (!url) {
        fetchStatus.textContent = 'URLを入力してください';
        return;
      }

      fetchStatus.textContent = '取得中…';

      // 前回の取得結果を一旦リセットしてから取得し直す
      eventTitleInput.value = '';
      eventTicketTypeInput.value = '';
      ticketTypeSelect.innerHTML = '<option value="">-- 候補から選ぶ --</option>';
      ticketTypeSelect.value = '';
      ticketTypeSelect.style.display = 'none';
      eventDateInput.value = '';
      eventShowtimeInput.value = '';
      eventImageInput.value = '';
      updateImagePreview();
      eventVenueInput.value = '';
      eventVenueMapInput.value = '';
      ticketShowtimeMap = {};

      let doc = null;
      let fetchError = null;

      // 複数の取得方法を順番に試す(1つ失敗しても次を試す)
      const attempts = [
        function () { return fetch('https://nakao.n90910syu.workers.dev/?url=' + encodeURIComponent(url)); },
        function () { return fetch('https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(url)); },
        function () { return fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(url)); },
        function () { return fetch(url); }
      ];

      for (const attempt of attempts) {
        try {
          const response = await attempt();
          if (!response.ok) {
            throw new Error('ネットワークエラー: ' + response.status);
          }
          const html = await response.text();
          if (!html || html.length < 100) {
            throw new Error('取得内容が空でした');
          }
          doc = new DOMParser().parseFromString(html, 'text/html');
          fetchError = null;
          break;
        } catch (err) {
          fetchError = err;
        }
      }

      // 取得できなかった項目は空欄のまま(既存の入力があれば消さない)。
      // 取れた項目だけ、その項目の欄に反映する。
      let gotCount = 0;

      if (doc) {
        const titleEl = doc.querySelector('.pg-event__header__title');
        const ogTitle = doc.querySelector('meta[property="og:title"]');
        const titleText = (titleEl && titleEl.textContent.trim()) || (ogTitle && ogTitle.getAttribute('content') || '').trim();
        if (titleText) {
          eventTitleInput.value = titleText;
          gotCount++;
        }

        const dateEl = doc.querySelector('.pg-event__ordering__program__datetime');
        let rawDate = dateEl ? dateEl.textContent.replace(/\u00a0/g, ' ').trim() : '';
        if (!rawDate) {
          // 予備: 「開催日」の項目、または ld+json の startDate
          doc.querySelectorAll('.pg-event__detail__section').forEach(function (dl) {
            const dt = dl.querySelector('.pg-event__detail__title');
            const dd = dl.querySelector('.pg-event__detail__contents');
            if (!rawDate && dt && dt.textContent.trim() === '開催日' && dd) rawDate = dd.textContent.trim();
          });
        }
        if (!rawDate) {
          const ld = doc.querySelector('script[type="application/ld+json"]');
          const lm = ld ? /"startDate"\s*:\s*"([^"]+)"/.exec(ld.textContent) : null;
          if (lm) rawDate = lm[1];
        }
        if (rawDate) {
          // 会場の開場時刻など余計な部分を除き、日付(+曜日)だけを取り出す
          const dateMatch = rawDate.match(/(\d{4})年(\d{1,2})月(\d{1,2})日(?:\(([^)]+)\))?/);
          if (dateMatch) {
            const y = dateMatch[1];
            const m = dateMatch[2].padStart(2, '0');
            const d = dateMatch[3].padStart(2, '0');
            const weekday = dateMatch[4] || weekdayKanji[new Date(Number(y), Number(m) - 1, Number(d)).getDay()];
            eventDateInput.value = y + '年' + m + '月' + d + '日(' + weekday + ')';

            // プルダウンの初期値も取得した日付に合わせておく
            dateYearSelect.value = y;
            dateMonthSelect.value = m;
            dateDaySelect.value = d;
          } else {
            eventDateInput.value = rawDate;
          }
          gotCount++;
        }

        // 開場・開演: チケットごとに持っている(後でチケットを選んだとき、そのチケットの時刻に切り替わる)
        ticketShowtimeMap = collectTicketShowtimes(doc);
        let showtime = '';
        const firstH6Key = Object.keys(ticketShowtimeMap)[0];
        if (firstH6Key) showtime = ticketShowtimeMap[firstH6Key];
        if (!showtime) {
          doc.querySelectorAll('.pg-event__detail__title').forEach(function (el) {
            if (!showtime) showtime = normalizeShowtime(el.textContent);
          });
        }
        if (showtime) {
          applyShowtime(showtime);
          gotCount++;
        }

        const imgEl = doc.querySelector('.pg-event__event_image__figure img');
        const ogImage = doc.querySelector('meta[property="og:image"]');
        let imageUrl = imgEl
          ? (imgEl.getAttribute('data-src') || imgEl.getAttribute('src') || '')
          : '';
        // 保存したページなどで画像が「ダミー」になっている場合は、og:image(本物の画像)を使う
        if (!imageUrl || /dammy|\.gif(\?|$)/.test(imageUrl)) {
          imageUrl = ogImage ? (ogImage.getAttribute('content') || '') : imageUrl;
        }
        if (imageUrl.indexOf('//') === 0) imageUrl = 'https:' + imageUrl;
        if (imageUrl) {
          eventImageInput.value = imageUrl;
          updateImagePreview();
          gotCount++;
        }

        // 会場: TIGETのチケット画面は place(会場名) と safe_map_url(そのリンク)を使う。
        // イベントページでは、見出し下の address 内のリンクが同じもの(文字=会場名、href=リンク先)。
        let venueEl = doc.querySelector('.pg-event__header__address a');
        if (!venueEl) {
          doc.querySelectorAll('.pg-event__detail__section').forEach(function (dl) {
            const dt = dl.querySelector('.pg-event__detail__title');
            if (!venueEl && dt && dt.textContent.trim() === '会場') venueEl = dl.querySelector('.pg-event__detail__contents a');
          });
        }
        if (!venueEl) venueEl = doc.querySelector('a[href*="maps.google.com"]');
        if (venueEl) {
          const venueName = ownText(venueEl) || venueEl.textContent.trim();
          const venueMapUrl = venueEl.getAttribute('href') || '';
          if (venueName) {
            eventVenueInput.value = venueName;
            gotCount++;
          }
          if (venueMapUrl) {
            eventVenueMapInput.value = venueMapUrl;
            gotCount++;
          }
        }

        const ticketNameEls = doc.querySelectorAll('.c-ordering-btn__content__name');
        const ticketNames = Array.from(ticketNameEls)
          .map(extractLeadingText)
          .filter(function (t, idx, arr) {
            return t && arr.indexOf(t) === idx; // 重複除去
          });

        ticketTypeSelect.innerHTML = '<option value="">-- 候補から選ぶ --</option>';
        ticketNames.forEach(function (name) {
          const opt = document.createElement('option');
          opt.value = name;
          opt.textContent = name;
          ticketTypeSelect.appendChild(opt);
        });

        if (ticketNames.length > 0) {
          ticketTypeSelect.style.display = 'block';
        } else {
          ticketTypeSelect.style.display = 'none';
        }

        if (ticketNames.length === 1) {
          eventTicketTypeInput.value = ticketNames[0];
          ticketTypeSelect.value = ticketNames[0];
          applyShowtime(showtimeForTicket(ticketNames[0]));
          gotCount++;
        } else if (ticketNames.length > 1) {
          // 古い値が残っていると選択済みに見えて紛らわしいので一旦空にする
          eventTicketTypeInput.value = '';
          ticketTypeSelect.value = '';
          fetchStatus.textContent = 'チケット種別が複数見つかりました。プルダウンから選択するか入力してください。';
        }
      }

      if (fetchError) {
        fetchStatus.textContent = '取得できませんでした(' + fetchError.message + ')。空欄の項目は手入力してください。';
      } else if (gotCount === 0) {
        fetchStatus.textContent = 'ページは取得できましたが、対象の情報が見つかりませんでした。手入力してください。';
      } else {
        fetchStatus.textContent = gotCount + '件の項目を取得しました。空欄が残っていれば手入力してください。';
      }
    });

    // ---- チケット画面の色 ----
    // TIGET本体は、イベントごとに決まった色(specific_color)を入場受付ボタンと時計の丸に使う。
    // 色はイベントのページからは分からないので、ここで選ぶ。選ばなければ標準の色。
    const ticketColorSelect = document.getElementById('ticketColorSelect');
    const ticketColorPicker = document.getElementById('ticketColorPicker');
    const showtimeNoDotCheck = document.getElementById('showtimeNoDotCheck');
    function currentTicketColor() {
      if (ticketColorSelect.value === 'custom') return ticketColorPicker.value;
      return ticketColorSelect.value;
    }
    ticketColorSelect.addEventListener('change', function () {
      ticketColorPicker.style.display = ticketColorSelect.value === 'custom' ? 'block' : 'none';
      goLink.classList.add('disabled');
    });
    ticketColorPicker.addEventListener('input', function () { goLink.classList.add('disabled'); });
    showtimeNoDotCheck.addEventListener('change', function () { goLink.classList.add('disabled'); });

    document.getElementById('resetAdmitBtn').addEventListener('click', function () {
      try { localStorage.removeItem('tigetAdmitted'); } catch (e) {}
      this.textContent = 'リセットしました';
    });

    saveAllBtn.addEventListener('click', function () {
      try { localStorage.removeItem('tigetAdmitted'); } catch (e) {}
      localStorage.setItem('tigetColor', currentTicketColor());
      localStorage.setItem('tigetShowtimeNoDot', showtimeNoDotCheck.checked ? '1' : '');
      localStorage.setItem('userInput', input.value.trim());
      localStorage.setItem('userName', nameInput.value.trim());
      localStorage.setItem('userGroup', groupInput.value.trim());
      localStorage.setItem('userPhone', phoneInput.value.trim());
      localStorage.setItem('userAddress', addressInput.value.trim());

      localStorage.setItem('eventTitle', eventTitleInput.value.trim());
      localStorage.setItem('eventDate', eventDateInput.value.trim());
      localStorage.setItem('eventShowtime', eventShowtimeInput.value.trim());
      localStorage.setItem('eventImage', eventImageInput.value.trim());
      localStorage.setItem('eventVenue', eventVenueInput.value.trim());
      localStorage.setItem('eventVenueMapUrl', eventVenueMapInput.value.trim());
      localStorage.setItem('eventTicketType', eventTicketTypeInput.value.trim());

      goLink.classList.remove('disabled');

      alert('保存しました');
    });

    // 保存後に何かの入力欄が変更されたら、再度保存するまでGOを無効化する
    const allInputs = [
      input, nameInput, groupInput, phoneInput, addressInput,
      eventUrlInput, eventTitleInput, eventTicketTypeInput,
      eventDateInput, eventShowtimeInput, eventImageInput,
      eventVenueInput, eventVenueMapInput
    ];
    allInputs.forEach(function (el) {
      if (!el) return;
      el.addEventListener('input', function () {
        goLink.classList.add('disabled');
      });
    });
  </script>

</body></html>
