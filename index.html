<!DOCTYPE html>
<html lang="ja"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>整理番号入力</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Hiragino Sans", "Hiragino Kaku Gothic ProN",
                   Arial, sans-serif;
      background: #f7f7f7;
      padding: 24px;
    }

    .box {
      max-width: 420px;
      margin: 0 auto;
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
    }

    h2 {
      font-size: 20px;
      margin-bottom: 16px;
      text-align: center;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      font-size: 20px;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    .btn {
      display: block;
      width: 100%;
      height: 48px;
      border-radius: 999px;
      border: none;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      line-height: 48px;
      text-decoration: none;
      box-sizing: border-box;
    }

    .save {
      margin-top: 20px;
      background: #2d9cdb;
      color: #fff;
    }

    .link-area {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }

    .link {
      flex: 1;
      background: #eee;
      color: #333;
    }

    .note {
      margin-top: 14px;
      font-size: 13px;
      color: #666;
      line-height: 1.6;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="box">

    <label for="userInput">整理番号</label>

    <input id="userInput" type="text" placeholder="S">

    <button type="button" class="btn save" id="saveBtn">
      保存
    </button>



    <div class="link-area">
      <a href="homepage.html" class="btn link">
        GO
      </a>
    </div>







    <p class="note">
      ※必ず保存後に表示
    </p>
  </div>

  <script>
    const input = document.getElementById('userInput');
    const saveBtn = document.getElementById('saveBtn');

    // 保存済みがあれば復元、なければ「S 」を初期表示
    const saved = localStorage.getItem('userInput');
    input.value = saved && saved.trim() !== '' ? saved : 'S';

    // 保存のみ
    saveBtn.addEventListener('click', function () {
      const value = input.value.trim();

      localStorage.setItem('userInput', value);

      alert('保存しました');
    });
  </script>

</body></html>
