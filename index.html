<!DOCTYPE html>
<html lang="ja"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>整理番号入力</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Hiragino Sans", "Hiragino Kaku Gothic ProN",
                   Arial, sans-serif;
      background: #f7f7f7;
      padding: 24px;
    }

    .box {
      max-width: 420px;
      margin: 0 auto;
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
    }

    h2 {
      font-size: 20px;
      margin-bottom: 16px;
      text-align: center;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      font-size: 20px;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    .btn {
      display: block;
      width: 100%;
      height: 48px;
      border-radius: 999px;
      border: none;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      line-height: 48px;
      text-decoration: none;
      box-sizing: border-box;
    }

    .save {
      margin-top: 20px;
      background: #2d9cdb;
      color: #fff;
    }

    .link-area {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }

    .link {
      flex: 1;
      background: #eee;
      color: #333;
    }

    .note {
      margin-top: 14px;
      font-size: 13px;
      color: #666;
      line-height: 1.6;
      text-align: center;
    }

    select {
      width: 100%;
      font-size: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      background: #fff;
    }

    .divider {
      margin: 24px 0;
      border: none;
      border-top: 1px solid #e2e2e2;
    }

    .fetch-btn {
      margin-top: 12px;
      background: #6c5ce7;
      color: #fff;
    }

    .result-box {
      margin-top: 16px;
      padding: 14px;
      background: #f7f7f7;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.7;
      color: #333;
      word-break: break-all;
      display: none;
    }

    .result-box.show {
      display: block;
    }

    .result-box img {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 8px;
    }

    .status-text {
      margin-top: 10px;
      font-size: 13px;
      color: #888;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="box">

    <label for="userInput">整理番号</label>

    <input id="userInput" type="text" placeholder="S">

    <label for="userNameInput" style="margin-top:16px;">氏名</label>

    <input id="userNameInput" type="text" placeholder="中村 海斗">

    <label for="userGroupInput" style="margin-top:16px;">お目当てのグループ</label>

    <input id="userGroupInput" type="text" placeholder="Peel the Apple">

    <label for="userPhoneInput" style="margin-top:16px;">電話番号</label>

    <input id="userPhoneInput" type="text" placeholder="090-3728-9947">

    <label for="userAddressInput" style="margin-top:16px;">住所</label>

    <input id="userAddressInput" type="text" placeholder="〒102-8353 東京都千代田区六番町4番地5 SME六番町ビル">

    <button type="button" class="btn save" id="saveBtn">
      保存
    </button>

    <hr class="divider">

    <label for="eventUrlInput">TIGETイベントURL</label>

    <input id="eventUrlInput" type="text" placeholder="https://tiget.net/events/524277">

    <button type="button" class="btn fetch-btn" id="fetchBtn">
      イベント情報を取得
    </button>

    <p class="status-text" id="fetchStatus"></p>

    <label for="eventTitleInput" style="margin-top:16px;">イベントタイトル</label>
    <input id="eventTitleInput" type="text" placeholder="自動取得 or 手入力">

    <label for="eventTicketTypeInput" style="margin-top:16px;">チケット種別</label>
    <input id="eventTicketTypeInput" list="ticketTypeOptions" type="text" placeholder="自動取得 or 手入力(候補があれば選択可)">
    <datalist id="ticketTypeOptions"></datalist>

    <label for="eventDateInput" style="margin-top:16px;">日時</label>
    <input id="eventDateInput" type="text" placeholder="自動取得 or 手入力">

    <label for="eventShowtimeInput" style="margin-top:16px;">開場/開演</label>
    <input id="eventShowtimeInput" type="text" placeholder="自動取得 or 手入力">

    <label for="eventImageInput" style="margin-top:16px;">画像URL</label>
    <input id="eventImageInput" type="text" placeholder="自動取得 or 手入力">

    <div class="result-box show" id="resultBox">
      <img id="resultImage" src="" alt="" style="display:none;">
    </div>

    <button type="button" class="btn save" id="saveEventBtn" style="margin-top:14px; display:none;">
      この内容を保存
    </button>



    <div class="link-area">
      <a href="homepage.html" class="btn link">
        GO
      </a>
    </div>







    <p class="note">
      ※必ず保存後に表示
    </p>
  </div>

  <script>
    const input = document.getElementById('userInput');
    const nameInput = document.getElementById('userNameInput');
    const groupInput = document.getElementById('userGroupInput');
    const phoneInput = document.getElementById('userPhoneInput');
    const addressInput = document.getElementById('userAddressInput');
    const saveBtn = document.getElementById('saveBtn');

    // 保存済みがあれば復元、なければ初期値(プレースホルダーと同じ)を表示
    function restore(el, key, fallback) {
      if (!el) return;
      const saved = localStorage.getItem(key);
      el.value = saved && saved.trim() !== '' ? saved : fallback;
    }

    restore(input, 'userInput', 'S');
    restore(nameInput, 'userName', '中村 海斗');
    restore(groupInput, 'userGroup', 'Peel the Apple');
    restore(phoneInput, 'userPhone', '090-3728-9947');
    restore(addressInput, 'userAddress', '〒102-8353 東京都千代田区六番町4番地5 SME六番町ビル');

    restore(document.getElementById('eventTitleInput'), 'eventTitle', '');
    restore(document.getElementById('eventTicketTypeInput'), 'eventTicketType', '');
    restore(document.getElementById('eventDateInput'), 'eventDate', '');
    restore(document.getElementById('eventShowtimeInput'), 'eventShowtime', '');
    restore(document.getElementById('eventImageInput'), 'eventImage', '');
    // 保存
    saveBtn.addEventListener('click', function () {
      localStorage.setItem('userInput', input.value.trim());
      localStorage.setItem('userName', nameInput.value.trim());
      localStorage.setItem('userGroup', groupInput.value.trim());
      localStorage.setItem('userPhone', phoneInput.value.trim());
      localStorage.setItem('userAddress', addressInput.value.trim());

      alert('保存しました');
    });

    // ==========================
    // TIGETイベント情報の自動取得
    // ==========================
    const eventUrlInput = document.getElementById('eventUrlInput');
    const fetchBtn = document.getElementById('fetchBtn');
    const fetchStatus = document.getElementById('fetchStatus');
    const eventTitleInput = document.getElementById('eventTitleInput');
    const eventTicketTypeInput = document.getElementById('eventTicketTypeInput');
    const ticketTypeOptions = document.getElementById('ticketTypeOptions');
    const eventDateInput = document.getElementById('eventDateInput');
    const eventShowtimeInput = document.getElementById('eventShowtimeInput');
    const eventImageInput = document.getElementById('eventImageInput');
    const resultImage = document.getElementById('resultImage');
    const saveEventBtn = document.getElementById('saveEventBtn');

    // <br>より前のテキストだけを取り出す(ネストしたdivや価格部分を除外)
    function extractLeadingText(el) {
      let text = '';
      for (const node of el.childNodes) {
        if (node.nodeName && node.nodeName.toLowerCase() === 'br') break;
        text += node.textContent || '';
      }
      return text.trim();
    }

    function updateImagePreview() {
      const url = eventImageInput.value.trim();
      if (url) {
        resultImage.src = url;
        resultImage.style.display = 'block';
      } else {
        resultImage.style.display = 'none';
      }
    }

    eventImageInput.addEventListener('input', updateImagePreview);
    updateImagePreview();

    fetchBtn.addEventListener('click', async function () {
      const url = eventUrlInput.value.trim();
      if (!url) {
        fetchStatus.textContent = 'URLを入力してください';
        return;
      }

      fetchStatus.textContent = '取得中…';

      let doc = null;
      let fetchError = null;

      // 複数の取得方法を順番に試す(1つ失敗しても次を試す)
      const attempts = [
        function () { return fetch('https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(url)); },
        function () { return fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(url)); },
        function () { return fetch(url); }
      ];

      for (const attempt of attempts) {
        try {
          const response = await attempt();
          if (!response.ok) {
            throw new Error('ネットワークエラー: ' + response.status);
          }
          const html = await response.text();
          if (!html || html.length < 100) {
            throw new Error('取得内容が空でした');
          }
          doc = new DOMParser().parseFromString(html, 'text/html');
          fetchError = null;
          break;
        } catch (err) {
          fetchError = err;
        }
      }

      // 取得できなかった項目は空欄のまま(既存の入力があれば消さない)。
      // 取れた項目だけ、その項目の欄に反映する。
      let gotCount = 0;

      if (doc) {
        const titleEl = doc.querySelector('.pg-event__header__title');
        if (titleEl && titleEl.textContent.trim()) {
          eventTitleInput.value = titleEl.textContent.trim();
          gotCount++;
        }

        const dateEl = doc.querySelector('.pg-event__ordering__program__datetime');
        if (dateEl && dateEl.textContent.trim()) {
          eventDateInput.value = dateEl.textContent.trim();
          gotCount++;
        }

        const detailTitleEls = doc.querySelectorAll('.pg-event__detail__title');
        let showtime = '';
        detailTitleEls.forEach(function (el) {
          const t = el.textContent.trim();
          if (t.includes('開場') || t.includes('開演')) {
            showtime = t;
          }
        });
        if (showtime) {
          eventShowtimeInput.value = showtime;
          gotCount++;
        }

        const imgEl = doc.querySelector('.pg-event__event_image__figure img');
        const imageUrl = imgEl
          ? (imgEl.getAttribute('data-src') || imgEl.getAttribute('src') || '')
          : '';
        if (imageUrl) {
          eventImageInput.value = imageUrl;
          updateImagePreview();
          gotCount++;
        }

        const ticketNameEls = doc.querySelectorAll('.c-ordering-btn__content__name');
        const ticketNames = Array.from(ticketNameEls)
          .map(extractLeadingText)
          .filter(function (t, idx, arr) {
            return t && arr.indexOf(t) === idx; // 重複除去
          });

        ticketTypeOptions.innerHTML = '';
        ticketNames.forEach(function (name) {
          const opt = document.createElement('option');
          opt.value = name;
          ticketTypeOptions.appendChild(opt);
        });
        if (ticketNames.length === 1) {
          eventTicketTypeInput.value = ticketNames[0];
          gotCount++;
        } else if (ticketNames.length > 1 && !eventTicketTypeInput.value) {
          fetchStatus.textContent = 'チケット種別が複数見つかりました。候補から選択するか入力してください。';
        }
      }

      if (fetchError) {
        fetchStatus.textContent = '取得できませんでした(' + fetchError.message + ')。空欄の項目は手入力してください。';
      } else if (gotCount === 0) {
        fetchStatus.textContent = 'ページは取得できましたが、対象の情報が見つかりませんでした。手入力してください。';
      } else {
        fetchStatus.textContent = gotCount + '件の項目を取得しました。空欄が残っていれば手入力してください。';
      }
    });

    saveEventBtn.addEventListener('click', function () {
      localStorage.setItem('eventTitle', eventTitleInput.value.trim());
      localStorage.setItem('eventDate', eventDateInput.value.trim());
      localStorage.setItem('eventShowtime', eventShowtimeInput.value.trim());
      localStorage.setItem('eventImage', eventImageInput.value.trim());
      localStorage.setItem('eventTicketType', eventTicketTypeInput.value.trim());

      alert('イベント情報を保存しました');
    });
  </script>

</body></html>
