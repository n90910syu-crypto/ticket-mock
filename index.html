<!DOCTYPE html>
<html lang="ja"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>整理番号入力</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Hiragino Sans", "Hiragino Kaku Gothic ProN",
                   Arial, sans-serif;
      background: #f7f7f7;
      padding: 24px;
    }

    .box {
      max-width: 420px;
      margin: 0 auto;
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
    }

    h2 {
      font-size: 20px;
      margin-bottom: 16px;
      text-align: center;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      font-size: 20px;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    .btn {
      display: block;
      width: 100%;
      height: 48px;
      border-radius: 999px;
      border: none;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      line-height: 48px;
      text-decoration: none;
      box-sizing: border-box;
    }

    .save {
      margin-top: 20px;
      background: #2d9cdb;
      color: #fff;
    }

    .link-area {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }

    .link {
      flex: 1;
      background: #eee;
      color: #333;
    }

    .note {
      margin-top: 14px;
      font-size: 13px;
      color: #666;
      line-height: 1.6;
      text-align: center;
    }

    select {
      width: 100%;
      font-size: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      background: #fff;
    }

    .divider {
      margin: 24px 0;
      border: none;
      border-top: 1px solid #e2e2e2;
    }

    .fetch-btn {
      margin-top: 12px;
      background: #6c5ce7;
      color: #fff;
    }

    .result-box {
      margin-top: 16px;
      padding: 14px;
      background: #f7f7f7;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.7;
      color: #333;
      word-break: break-all;
      display: none;
    }

    .result-box.show {
      display: block;
    }

    .result-box img {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 8px;
    }

    .status-text {
      margin-top: 10px;
      font-size: 13px;
      color: #888;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="box">

    <label for="userInput">整理番号</label>

    <input id="userInput" type="text" placeholder="S">

    <label for="userNameInput" style="margin-top:16px;">氏名</label>

    <input id="userNameInput" type="text" placeholder="中村 海斗">

    <label for="userGroupInput" style="margin-top:16px;">お目当てのグループ</label>

    <input id="userGroupInput" type="text" placeholder="Peel the Apple">

    <label for="userPhoneInput" style="margin-top:16px;">電話番号</label>

    <input id="userPhoneInput" type="text" placeholder="090-3728-9947">

    <label for="userAddressInput" style="margin-top:16px;">住所</label>

    <input id="userAddressInput" type="text" placeholder="〒102-8353 東京都千代田区六番町4番地5 SME六番町ビル">

    <button type="button" class="btn save" id="saveBtn">
      保存
    </button>

    <hr class="divider">

    <label for="eventUrlInput">TIGETイベントURL</label>

    <input id="eventUrlInput" type="text" placeholder="https://tiget.net/events/524277">

    <button type="button" class="btn fetch-btn" id="fetchBtn">
      イベント情報を取得
    </button>

    <p class="status-text" id="fetchStatus"></p>

    <div id="ticketTypeArea" style="display:none; margin-top:16px;">
      <label for="ticketTypeSelect">チケット種別</label>
      <select id="ticketTypeSelect"></select>
    </div>

    <div class="result-box" id="resultBox">
      <div><strong>タイトル:</strong> <span id="resultTitle"></span></div>
      <div><strong>日時:</strong> <span id="resultDate"></span></div>
      <div><strong>開場/開演:</strong> <span id="resultShowtime"></span></div>
      <div id="resultImageWrap"><img id="resultImage" src="" alt=""></div>
    </div>

    <button type="button" class="btn save" id="saveEventBtn" style="margin-top:14px; display:none;">
      この内容を保存
    </button>



    <div class="link-area">
      <a href="homepage.html" class="btn link">
        GO
      </a>
    </div>







    <p class="note">
      ※必ず保存後に表示
    </p>
  </div>

  <script>
    const input = document.getElementById('userInput');
    const nameInput = document.getElementById('userNameInput');
    const groupInput = document.getElementById('userGroupInput');
    const phoneInput = document.getElementById('userPhoneInput');
    const addressInput = document.getElementById('userAddressInput');
    const saveBtn = document.getElementById('saveBtn');

    // 保存済みがあれば復元、なければ初期値(プレースホルダーと同じ)を表示
    function restore(el, key, fallback) {
      if (!el) return;
      const saved = localStorage.getItem(key);
      el.value = saved && saved.trim() !== '' ? saved : fallback;
    }

    restore(input, 'userInput', 'S');
    restore(nameInput, 'userName', '中村 海斗');
    restore(groupInput, 'userGroup', 'Peel the Apple');
    restore(phoneInput, 'userPhone', '090-3728-9947');
    restore(addressInput, 'userAddress', '〒102-8353 東京都千代田区六番町4番地5 SME六番町ビル');

    // 保存
    saveBtn.addEventListener('click', function () {
      localStorage.setItem('userInput', input.value.trim());
      localStorage.setItem('userName', nameInput.value.trim());
      localStorage.setItem('userGroup', groupInput.value.trim());
      localStorage.setItem('userPhone', phoneInput.value.trim());
      localStorage.setItem('userAddress', addressInput.value.trim());

      alert('保存しました');
    });

    // ==========================
    // TIGETイベント情報の自動取得
    // ==========================
    const eventUrlInput = document.getElementById('eventUrlInput');
    const fetchBtn = document.getElementById('fetchBtn');
    const fetchStatus = document.getElementById('fetchStatus');
    const ticketTypeArea = document.getElementById('ticketTypeArea');
    const ticketTypeSelect = document.getElementById('ticketTypeSelect');
    const resultBox = document.getElementById('resultBox');
    const resultTitle = document.getElementById('resultTitle');
    const resultDate = document.getElementById('resultDate');
    const resultShowtime = document.getElementById('resultShowtime');
    const resultImage = document.getElementById('resultImage');
    const saveEventBtn = document.getElementById('saveEventBtn');

    let fetchedEventData = null;

    // <br>より前のテキストだけを取り出す(ネストしたdivや価格部分を除外)
    function extractLeadingText(el) {
      let text = '';
      for (const node of el.childNodes) {
        if (node.nodeName && node.nodeName.toLowerCase() === 'br') break;
        text += node.textContent || '';
      }
      return text.trim();
    }

    fetchBtn.addEventListener('click', async function () {
      const url = eventUrlInput.value.trim();
      if (!url) {
        fetchStatus.textContent = 'URLを入力してください';
        return;
      }

      fetchStatus.textContent = '取得中…';
      resultBox.classList.remove('show');
      ticketTypeArea.style.display = 'none';
      saveEventBtn.style.display = 'none';

      try {
        const response = await fetch(url);

        if (!response.ok) {
          throw new Error('ネットワークエラー: ' + response.status);
        }

        const html = await response.text();
        const doc = new DOMParser().parseFromString(html, 'text/html');

        const titleEl = doc.querySelector('.pg-event__header__title');
        const title = titleEl ? titleEl.textContent.trim() : '(タイトル取得失敗)';

        const dateEl = doc.querySelector('.pg-event__ordering__program__datetime');
        const date = dateEl ? dateEl.textContent.trim() : '(日時取得失敗)';

        const detailTitleEls = doc.querySelectorAll('.pg-event__detail__title');
        let showtime = '(開場/開演 取得失敗)';
        detailTitleEls.forEach(function (el) {
          const t = el.textContent.trim();
          if (t.includes('開場') || t.includes('開演')) {
            showtime = t;
          }
        });

        const imgEl = doc.querySelector('.pg-event__event_image__figure img');
        const imageUrl = imgEl
          ? (imgEl.getAttribute('data-src') || imgEl.getAttribute('src') || '')
          : '';

        const ticketNameEls = doc.querySelectorAll('.c-ordering-btn__content__name');
        const ticketNames = Array.from(ticketNameEls)
          .map(extractLeadingText)
          .filter(function (t, idx, arr) {
            return t && arr.indexOf(t) === idx; // 重複除去
          });

        fetchedEventData = { title: title, date: date, showtime: showtime, imageUrl: imageUrl };

        // チケット種別のプルダウンを組み立て
        ticketTypeSelect.innerHTML = '';
        if (ticketNames.length > 0) {
          ticketNames.forEach(function (name) {
            const opt = document.createElement('option');
            opt.value = name;
            opt.textContent = name;
            ticketTypeSelect.appendChild(opt);
          });
          ticketTypeArea.style.display = 'block';
        }

        resultTitle.textContent = title;
        resultDate.textContent = date;
        resultShowtime.textContent = showtime;
        if (imageUrl) {
          resultImage.src = imageUrl;
          resultImage.style.display = 'block';
        } else {
          resultImage.style.display = 'none';
        }

        resultBox.classList.add('show');
        saveEventBtn.style.display = 'block';
        fetchStatus.textContent = '取得しました';
      } catch (err) {
        console.error(err);
        fetchStatus.textContent = '取得に失敗しました: ' + err.message;
      }
    });

    saveEventBtn.addEventListener('click', function () {
      if (!fetchedEventData) return;

      localStorage.setItem('eventTitle', fetchedEventData.title);
      localStorage.setItem('eventDate', fetchedEventData.date);
      localStorage.setItem('eventShowtime', fetchedEventData.showtime);
      localStorage.setItem('eventImage', fetchedEventData.imageUrl);
      localStorage.setItem('eventTicketType', ticketTypeSelect.value || '');

      alert('イベント情報を保存しました');
    });
  </script>

</body></html>
